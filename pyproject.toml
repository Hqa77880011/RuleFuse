[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RuleFuse"
version = "0.1.0"
description = "RuleFuse implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.scripts]
rulefuse = "rulefuse.cli:main"

[tool.setuptools.packages.find]
include = ["rulefuse*"]
